name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - name: Install Pillow for the share cards
        run: pip install pillow==11.3.0
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Build data and run validation checks
        run: python -m pipeline.build
      - name: Build share cards
        run: |
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf || sudo apt-get install -y fonts-dejavu-core
          python -m pipeline.cards
