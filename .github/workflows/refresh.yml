name: Refresh data and deploy

on:
  schedule:
    - cron: "0 11 * 3-11 *"   # daily during the season (Mar-Nov), after the night's games
    - cron: "0 11 * 12,1,2 1" # weekly on Mondays in the off-season
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "site/**", ".github/workflows/refresh.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Build data (fails if validation checks fail)
        run: python -m pipeline.build
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh calendar data ($(jq -r .last_game site/data/meta.json))"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
